<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduler — Schedule Board v9</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #090b10;
  --bg-1: #0f1117;
  --bg-2: #161922;
  --bg-3: #1e212b;
  --bg-4: #272d3a;
  --border: #1e222e;
  --border-light: #2a2f3e;
  --text-1: #e8eaf0;
  --text-2: #8b92a8;
  --text-3: #5a6078;
  --accent: #e85d04;
  --accent-dim: #c44a00;
  --blue: #4cc9f0;
  --green: #2dc653;
  --yellow: #f4d03f;
  --red: #e63946;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --font-mono: 'JetBrains Mono', monospace;
  --font-body: 'DM Sans', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { font-family: var(--font-body); background: var(--bg-0); color: var(--text-1); font-size: 12.5px; line-height: 1.5; overflow: hidden; }

/* ========== HEADER ========== */
.header { height: 44px; background: var(--bg-1); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
.logo { font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--accent); }
.btn { padding: 5px 12px; border-radius: 5px; border: none; font-family: var(--font-body); font-weight: 600; font-size: 11.5px; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; }
.btn-primary { background: var(--accent); color:#fff; }
.btn-primary:hover { background: var(--accent-dim); }
.btn-secondary { background: var(--bg-3); color: var(--text-1); border:1px solid var(--border-light); }
.btn-secondary:hover { background: var(--bg-4); }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid transparent; }
.btn-ghost:hover { background: var(--bg-3); color: var(--text-1); }
.btn-sm { padding: 3px 8px; font-size: 10.5px; }

/* ========== MAIN LAYOUT ========== */
.main { display:flex; height: calc(100vh - 44px); }

/* ========== LEFT: DEMAND POOL ========== */
.left-panel { width: 42%; min-width: 320px; background: var(--bg-1); border-right: 1px solid var(--border); display:flex; flex-direction:column; }

.pool-tabs { display:flex; gap:0; padding:0 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
.pool-tab { padding: 8px 14px; font-size:11px; font-weight:600; color:var(--text-3); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; display:flex; align-items:center; gap:6px; }
.pool-tab:hover { color:var(--text-2); }
.pool-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.pool-tab .count { font-family:var(--font-mono); font-size:10px; background:var(--bg-3); padding:1px 5px; border-radius:3px; }
.pool-tab.active .count { background:rgba(232,93,4,0.15); color:var(--accent); }

.pool-actions { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-height: 40px; }
.pool-actions.hidden { display: none; }

.pool-content { flex:1; overflow-y:auto; padding: 4px 0; }

/* Demand Row (collapsible) */
.demand-row { border-bottom: 1px solid var(--border); }
.demand-main { display: flex; align-items: center; gap: 6px; padding: 7px 12px; cursor: pointer; transition: background .1s; }
.demand-main:hover { background: var(--bg-2); }
.demand-main.selected { background: rgba(232,93,4,0.08); }

.dc-expand { display:flex; align-items:center; justify-content:center; color:var(--text-3); font-size:10px; width:14px; transition:transform .2s; }
.dc-expand.open { transform: rotate(90deg); color:var(--accent); }
.dc-check { display:flex; align-items:center; justify-content:center; }
.dc-check input { width: 13px; height: 13px; accent-color: var(--accent); cursor: pointer; }
.dc-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
.dc-id { font-family: var(--font-mono); font-weight: 600; font-size: 11px; flex-shrink: 0; }
.dc-customer { color: var(--text-2); font-size: 11px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dc-ddl { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); flex-shrink: 0; width: 50px; text-align: right; }
.dc-urgent { color: var(--red); font-weight: 600; }

/* Line Items */
.line-detail { display: none; padding: 0 12px 6px 30px; }
.line-detail.open { display: block; }
.line-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.02); transition: background .1s; }
.line-row:hover { background: var(--bg-2); }
.line-row.selected { box-shadow: inset 2px 0 0 var(--accent); background: rgba(232,93,4,0.04); }
.li-check input { width: 12px; height: 12px; accent-color: var(--accent); cursor: pointer; }
.li-pn { font-weight: 600; font-size: 11px; color: var(--text-1); }
.li-desc { color: var(--text-3); font-size: 10.5px; }
.li-demand { font-family: var(--font-mono); font-size: 10.5px; color: var(--red); font-weight: 700; }
.li-oh { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.li-shortage { color: var(--red); font-weight: 700; }

/* Demand Group */
.demand-group { background: rgba(232,93,4,0.04); border: 1px dashed var(--accent); border-radius: 6px; margin: 6px 12px; padding: 8px 10px; cursor: grab; transition: all .15s; }
.demand-group:hover { background: rgba(232,93,4,0.08); }
.demand-group.dragging { opacity: 0.4; }
.group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.group-icon { font-size: 14px; }
.group-title { font-weight: 700; font-size: 11.5px; color: var(--accent); }
.group-qty { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); margin-left: auto; }
.group-items { font-size: 10.5px; color: var(--text-2); line-height: 1.6; }
.group-tag { display: inline-block; padding: 1px 5px; border-radius: 3px; background: var(--bg-3); font-size: 9px; color: var(--text-3); margin-right: 4px; }

/* System Suggestion */
.suggest-card { background: rgba(244,208,63,0.05); border: 1px solid rgba(244,208,63,0.2); border-radius: 6px; margin: 6px 12px; padding: 8px 10px; }
.suggest-title { font-size: 10px; font-weight: 700; color: var(--yellow); margin-bottom: 4px; }
.suggest-body { font-size: 10.5px; color: var(--text-2); line-height: 1.5; }
.suggest-actions { display: flex; gap: 6px; margin-top: 6px; }

/* ========== RIGHT: EXEC COLUMNS ========== */
.right-panel { flex: 1; display: flex; flex-direction: row; overflow: hidden; }

.exec-column {
  flex: 1;
  min-width: 160px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  transition: flex .2s;
}
.exec-column:last-child { border-right: none; }
.exec-column.hidden { display: none; }

.col-header {
  padding: 8px 10px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.col-title {
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.col-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-3);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--text-3);
}
.col-toggle {
  font-size: 12px;
  color: var(--text-3);
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 3px;
}
.col-toggle:hover { color: var(--text-2); background: var(--bg-2); }

.col-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  min-height: 40px;
}
.col-list.drag-over {
  background: rgba(232,93,4,0.03);
}
.col-list:empty::before {
  content: '拖拽 Demand Group 到此处';
  display: block;
  padding: 24px 8px;
  text-align: center;
  color: var(--text-3);
  font-size: 11px;
}

/* Column Item */
.col-item {
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
.col-item:hover { background: var(--bg-2); }
.col-item.dragging { opacity: 0.3; }
.col-item.drag-over { border-top: 2px solid var(--accent); }

.col-item-main {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
}

.ci-grip {
  color: var(--text-3);
  font-size: 11px;
  opacity: 0;
  cursor: grab;
  flex-shrink: 0;
}
.ci-grip:active { cursor: grabbing; }
.col-item:hover .ci-grip { opacity: 0.4; }

.ci-main { flex: 1; min-width: 0; }
.ci-id { font-family: var(--font-mono); font-weight: 600; font-size: 10.5px; }
.ci-desc { font-size: 10px; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-site { font-family: var(--font-mono); font-size: 9px; color: var(--blue); margin-top: 1px; }
.ci-qty { font-family: var(--font-mono); font-size: 10px; color: var(--text-2); flex-shrink: 0; }
.ci-priority {
  flex-shrink: 0;
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  text-transform: uppercase;
}
.ci-priority.critical { background: rgba(230,57,70,0.15); color: var(--red); }
.ci-priority.high { background: rgba(232,93,4,0.15); color: var(--accent); }
.ci-priority.normal { background: rgba(139,146,168,0.15); color: var(--text-2); }
.ci-status {
  flex-shrink: 0;
  font-size: 9px;
  color: var(--text-3);
}

/* Column Item Detail */
.col-item-detail { display: none; padding: 0 10px 6px 32px; }
.col-item-detail.open { display: block; }

/* ========== CONFIG DIALOG ========== */
.dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; }
.dialog-overlay.open { display: flex; }
.dialog { background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px; width: 380px; max-width: 90vw; overflow: hidden; display: flex; flex-direction: column; }
.dialog-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; }
.dialog-body { padding: 14px 16px; }
.dialog-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

.form-row { margin-bottom: 10px; }
.form-label { font-size: 10px; font-weight: 600; color: var(--text-2); margin-bottom: 3px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input, .form-select { width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px; padding: 6px 10px; color: var(--text-1); font-family: var(--font-body); font-size: 12px; }
.form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }

.config-preview { background: var(--bg-2); padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 11px; color: var(--text-2); line-height: 1.6; }

/* ========== TOAST ========== */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-2); border: 1px solid var(--border-light); border-radius: 8px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 3000; transform: translateY(100px); opacity: 0; transition: all .3s; font-size: 12px; max-width: 320px; }
.toast.open { transform: translateY(0); opacity: 1; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 2px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="logo">◈ SCHEDULER</div>

</div>

<!-- Main -->

  <!-- Left: Demand Pool -->

  </div>

  <!-- Right: Exec Columns -->
  <div class="right-panel" id="right-panel">
    <!-- Filled by JS: JOB / PO / TO columns -->
  </div>

</div>

<!-- Config Dialog -->
<div class="dialog-overlay" id="config-dialog">
  <div class="dialog">
    <div class="dialog-header" id="cfg-title">创建 Job</div>
    <div class="dialog-body">
      <div class="form-row">
        <label class="form-label">Demand Group</label>
        <div id="cfg-group-info" style="font-size:11px;color:var(--text-2);"></div>

      </div>
      <div class="form-row">
        <label class="form-label">优先级</label>
        <select class="form-select" id="cfg-priority">
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="normal" selected>Normal</option>
        </select>
      </div>
      <div class="config-preview" id="cfg-preview"></div>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-secondary" onclick="closeConfigDialog()">取消</button>
      <button class="btn btn-primary" onclick="confirmConfig()">确认创建</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

function renderPool() {
  const container = document.getElementById('pool-content');
  const items = topDemands.filter(d => d.pool === currentPoolTab);
  
  document.getElementById('count-normal').textContent = topDemands.filter(d=>d.pool==='normal').length;
  document.getElementById('count-hold').textContent = topDemands.filter(d=>d.pool==='hold').length;
  document.getElementById('tab-normal').classList.toggle('active', currentPoolTab==='normal');
  document.getElementById('tab-hold').classList.toggle('active', currentPoolTab==='hold');
  
  const actionBar = document.getElementById('pool-actions');
  if (selectedPoolItems.size > 0) {
    actionBar.classList.remove('hidden');
    document.getElementById('sel-count').textContent = selectedPoolItems.size;
  } else {
    actionBar.classList.add('hidden');
  }
  
  let html = '';
  
  // System suggestions
  suggestions.filter(s => !s.dismissed).forEach(sug => {
    if (sug.type === 'merge') {
      html += `
        <div class="suggest-card">
          <div class="suggest-title">💡 系统建议: 合并 ${sug.demandIds.length} 个Demand</div>
          <div class="suggest-body">${sug.reason}<br>建议类型: <strong>${sug.suggestedType.toUpperCase()}</strong></div>
          <div class="suggest-actions">
            <button class="btn btn-primary btn-sm" onclick="acceptSuggestion('${sug.id}')">✓ 确认合并</button>
            <button class="btn btn-ghost btn-sm" onclick="dismissSuggestion('${sug.id}')">忽略</button>
          </div>
        </div>
      `;
    } else if (sug.type === 'split') {
      html += `
        <div class="suggest-card">
          <div class="suggest-title">💡 系统建议: 拆分 ${sug.demandId}</div>
          <div class="suggest-body">${sug.reason}</div>
          <div class="suggest-actions">
            <button class="btn btn-primary btn-sm" onclick="acceptSuggestion('${sug.id}')">✓ 确认拆分</button>
            <button class="btn btn-ghost btn-sm" onclick="dismissSuggestion('${sug.id}')">忽略</button>
          </div>
        </div>
      `;
    }
  });
  
  // Demand Groups
  demandGroups.forEach(g => {
    html += `
      <div class="demand-group" draggable="true" ondragstart="onGroupDragStart(event,'${g.id}')">
        <div class="group-header">
          <span class="group-icon">🔗</span>
          <span class="group-title">MERGED GROUP</span>
          <span class="group-qty">${g.totalQty}件</span>
        </div>
        <div class="group-items">
          ${g.demands.map(d => `<span class="group-tag">${d}</span>`).join('')}
        </div>
      </div>
    `;
  });
  
  // Demand rows
  items.forEach(d => html += renderDemandRow(d));
  
  container.innerHTML = html || '<div style="padding:24px;text-align:center;color:var(--text-3);">该分类下暂无 Demand</div>';
}

function renderDemandRow(d) {
  const isUrgent = d.ddl === 'ASAP' || (new Date(d.ddl) - new Date('2026-05-07')) / (1000*60*60*24) <= 3;
  const totalQty = d.lines.reduce((a,l) => a + l.qty, 0);
  const typeColors = {SO:'var(--yellow)', MTO:'var(--red)', REPLENISH:'var(--green)', REWORK:'#ff2e63', TRANSFER:'var(--blue)', SAMPLE:'var(--purple)'};
  const typeColor = typeColors[d.type] || 'var(--text-3)';
  
  return `
    <div class="demand-row">
      <div class="demand-main" onclick="toggleExpand('${d.id}')">
        <div class="dc-expand ${d.expanded?'open':''}">▶</div>
        <div class="dc-type" style="background:${typeColor}22;color:${typeColor};border:1px solid ${typeColor}44;">${d.type}</div>
        <div class="dc-id">${d.id}</div>
        <div class="dc-customer">${d.customer}</div>
        <div class="dc-ddl ${isUrgent?'dc-urgent':''}">${d.ddl==='ASAP'?'ASAP':fmtShortDate(d.ddl)}</div>
      </div>
      <div class="line-detail ${d.expanded?'open':''}">
        ${d.lines.map(l => {
          const key = `${d.id}:${l.line}`;
          const checked = selectedPoolItems.has(key);
          const shortage = l.demand > l.oh;
          return `
          <div class="line-row ${checked?'selected':''}">
            <div class="li-check"><input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();togglePoolSelect('${d.id}',${l.line})"></div>
            <div class="li-pn">${l.pn}</div>
            <div class="li-desc">${l.desc}</div>
            <div style="flex:1"></div>
            <div class="li-oh ${shortage?'li-shortage':''}">OH:${l.oh}</div>
            <div class="li-demand">需:${l.demand}</div>
            <div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);width:50px;text-align:right;">${l.qty}件</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function fmtShortDate(d) {
  const date = new Date(d);
  return (date.getMonth()+1) + '/' + date.getDate();
}

// ==================== RENDER COLUMNS ====================
function renderColumns() {
  const container = document.getElementById('right-panel');
  const colTypes = ['job','po','to'];
  const colLabels = {job:'JOB', po:'PO', to:'TO'};
  const colColors = {job:'var(--purple)', po:'var(--blue)', to:'var(--cyan)'};
  const visibleCount = colTypes.filter(c => columnVisibility[c]).length;
  
  container.innerHTML = colTypes.map(colType => {
    const isVisible = columnVisibility[colType];
    const items = execItems[colType];
    
    return `
      <div class="exec-column ${isVisible?'':'hidden'}" data-col="${colType}" style="${visibleCount>0?'flex:'+(isVisible?1:0):''}">
        <div class="col-header">
          <div class="col-title">
            <span style="color:${colColors[colType]};font-size:13px;">●</span>
            ${colLabels[colType]}
            <span class="col-badge">${items.length}</span>
          </div>
          <span class="col-toggle" onclick="toggleColumn('${colType}')" title="${isVisible?'隐藏':'显示'}列">
            ${isVisible?'👁':'👁‍🗨'}
          </span>
        </div>
        <div class="col-list" id="col-list-${colType}"
             ondragover="onColDragOver(event,'${colType}')"
             ondragleave="onColDragLeave(event)"
             ondrop="onColDrop(event,'${colType}')">
          ${items.map((item, idx) => renderColItem(item, colType, idx)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderColItem(item, colType, idx) {
  const priorityMap = {critical:'CRIT', high:'HIGH', normal:'NORM'};
  const statusMap = {'执行中':'▶','收货中':'📦','运输中':'🚚','已完成':'✓','已排程':'○','草稿':'○'};
  
  return `
    <div class="col-item" draggable="true"
         ondragstart="onItemDragStart(event,'${colType}',${idx})"
         ondragover="onItemDragOver(event,'${colType}',${idx})"
         ondragleave="onItemDragLeave(event)"
         ondrop="onItemDrop(event,'${colType}',${idx})"
         onclick="toggleColItemExpand('${colType}',${idx})">
      <div class="col-item-main">
        <div class="ci-grip">⋮⋮</div>
        <div class="ci-main">
          <div class="ci-id">${item.id}</div>
          <div class="ci-desc">${item.desc} · ${item.qty}件</div>
          ${item.site ? `<div class="ci-site">📍 ${item.site}厂</div>` : ''}
        </div>
        <div class="ci-priority ${item.priority}">${priorityMap[item.priority]}</div>
        <div class="ci-status">${statusMap[item.status] || '○'} ${item.status}</div>
      </div>
    </div>
  `;
}

// ==================== INTERACTIONS ====================
function switchPoolTab(tab) {
  currentPoolTab = tab;
  selectedPoolItems.clear();
  renderPool();
}

function toggleExpand(id) {
  const d = topDemands.find(x => x.id === id);
  if (d) d.expanded = !d.expanded;
  renderPool();
}

function togglePoolSelect(demandId, lineNo) {
  const key = `${demandId}:${lineNo}`;
  if (selectedPoolItems.has(key)) selectedPoolItems.delete(key);
  else selectedPoolItems.add(key);
  renderPool();
}

function clearPoolSelection() {
  selectedPoolItems.clear();
  renderPool();
}

function mergeSelected() {
  if (selectedPoolItems.size < 2) {
    showToast('无法合并', '请至少选择 2 个 Line Item');
    return;
  }
  const ids = Array.from(selectedPoolItems);
  let totalQty = 0;
  ids.forEach(key => {
    const [did, line] = key.split(':');
    const d = topDemands.find(x => x.id === did);
    if (d) {
      const l = d.lines.find(x => x.line == line);
      if (l) totalQty += l.qty;
    }
  });
  
  demandGroups.push({
    id: 'GRP-' + String(demandGroups.length + 1).padStart(3, '0'),
    demands: ids,
    suggestedType: 'job',
    totalQty
  });
  selectedPoolItems.clear();
  showToast('已合并', `${ids.length} 个 Line Item → 新Group，共 ${totalQty}件`);
  renderPool();
}

function acceptSuggestion(sugId) {
  const sug = suggestions.find(s => s.id === sugId);
  if (!sug) return;
  
  if (sug.type === 'merge') {
    let totalQty = 0;
    sug.demandIds.forEach(key => {
      const [did, line] = key.includes(':') ? key.split(':') : [key, '1'];
      const d = topDemands.find(x => x.id === did);
      if (d) {
        const l = d.lines.find(x => x.line == line);
        if (l) totalQty += l.qty;
      }
    });
    demandGroups.push({
      id: 'GRP-' + String(demandGroups.length + 1).padStart(3, '0'),
      demands: sug.demandIds,
      suggestedType: sug.suggestedType,
      totalQty
    });
  }
  sug.dismissed = true;
  showToast('已采纳', '系统建议已处理');
  renderPool();
}

function dismissSuggestion(sugId) {
  const sug = suggestions.find(s => s.id === sugId);
  if (sug) sug.dismissed = true;
  renderPool();
}

function toggleColumn(colType) {
  columnVisibility[colType] = !columnVisibility[colType];
  renderColumns();
}

function toggleColItemExpand(colType, idx) {
  const item = execItems[colType][idx];
  if (item) item.expanded = !item.expanded;
  // For simplicity, just re-render. Could optimize with DOM mutation.
  renderColumns();
}

// ==================== DRAG: Group → Column ====================
function onGroupDragStart(e, groupId) {
  e.dataTransfer.setData('text/plain', 'GROUP:' + groupId);
  e.dataTransfer.effectAllowed = 'move';
}

function onColDragOver(e, colType) {
  e.preventDefault();
  const list = document.getElementById(`col-list-${colType}`);
  if (list) list.classList.add('drag-over');
}

function onColDragLeave(e) {
  document.querySelectorAll('.col-list').forEach(l => l.classList.remove('drag-over'));
}

function onColDrop(e, colType) {
  e.preventDefault();
  document.querySelectorAll('.col-list').forEach(l => l.classList.remove('drag-over'));
  const data = e.dataTransfer.getData('text/plain');
  if (!data) return;
  
  let demandIds = [];
  let totalQty = 0;
  
  if (data.startsWith('GROUP:')) {
    const groupId = data.replace('GROUP:', '');
    const group = demandGroups.find(g => g.id === groupId);
    if (!group) return;
    demandIds = group.demands;
    totalQty = group.totalQty;
  } else {
    demandIds = [data];
    const [did, line] = data.split(':');
    const d = topDemands.find(x => x.id === did);
    if (d) {
      const l = d.lines.find(x => x.line == line);
      if (l) totalQty = l.qty;
    }
  }
  
  configTarget = { demandIds, colType, totalQty };
  openConfigDialog();
}

// ==================== DRAG: Column Item Reorder ====================
function onItemDragStart(e, colType, idx) {
  e.dataTransfer.setData('text/plain', 'ITEM:' + colType + ':' + idx);
  e.dataTransfer.effectAllowed = 'move';
  dragSrcCol = colType;
  dragSrcIndex = idx;
  e.target.classList.add('dragging');
}

function onItemDragOver(e, colType, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.target.closest('.col-item');
  if (target && dragSrcCol === colType) {
    target.classList.add('drag-over');
  }
}

function onItemDragLeave(e) {
  const target = e.target.closest('.col-item');
  if (target) target.classList.remove('drag-over');
}

function onItemDrop(e, colType, targetIdx) {
  e.preventDefault();
  e.stopPropagation();
  const data = e.dataTransfer.getData('text/plain');
  document.querySelectorAll('.col-item').forEach(el => {
    el.classList.remove('drag-over', 'dragging');
  });
  
  if (!data || !data.startsWith('ITEM:')) return;
  const parts = data.split(':');
  const srcCol = parts[1];
  const srcIdx = parseInt(parts[2]);
  
  if (srcCol !== colType) return; // Same column only for now
  
  // Reorder within same column
  const items = execItems[colType];
  const [moved] = items.splice(srcIdx, 1);
  items.splice(targetIdx, 0, moved);
  
  showToast('优先级已更新', `${moved.id} 已调整位置`);
  renderColumns();
}

// ==================== CONFIG DIALOG ====================
function openConfigDialog() {
  const dialog = document.getElementById('config-dialog');
  const colLabels = {job:'创建 Job', po:'创建 PO', to:'创建 TO'};
  document.getElementById('cfg-title').textContent = colLabels[configTarget.colType];
  document.getElementById('cfg-group-info').innerHTML = `
    <strong>${configTarget.demandIds.length}</strong> 个Demand · 
    数量: <strong>${configTarget.totalQty}件</strong>
  `;
  document.getElementById('cfg-qty').value = configTarget.totalQty;
  
  // Show/hide site selector based on column type
  const siteRow = document.getElementById('cfg-site-row');
  if (configTarget.colType === 'job') {
    siteRow.style.display = 'none';
  } else {
    siteRow.style.display = 'block';
    document.getElementById('cfg-site').value = '';
  }
  
  updateConfigPreview();
  dialog.classList.add('open');
}

function closeConfigDialog() {
  document.getElementById('config-dialog').classList.remove('open');
  configTarget = null;
}

function updateConfigPreview() {
  const qty = document.getElementById('cfg-qty').value || configTarget.totalQty;
  const priority = document.getElementById('cfg-priority').value;
  const site = document.getElementById('cfg-site').value;
  
  const typeLabels = {job:'Job（生产/返工）', po:'PO（采购）', to:'TO（调拨）'};
  let preview = `<strong>预览:</strong> 创建 <strong>${typeLabels[configTarget.colType]}</strong><br>`;
  preview += `数量: ${qty}件 · 优先级: ${priority.toUpperCase()}<br>`;
  if (site) preview += `目标 Site: ${site}厂<br>`;
  preview += `关联Demand: ${configTarget.demands.join(', ')}`;
  
  document.getElementById('cfg-preview').innerHTML = preview;
}

document.getElementById('cfg-qty').addEventListener('input', updateConfigPreview);
document.getElementById('cfg-priority').addEventListener('change', updateConfigPreview);
document.getElementById('cfg-site').addEventListener('change', updateConfigPreview);

function confirmConfig() {
  if (!configTarget) return;
  
  const qty = parseInt(document.getElementById('cfg-qty').value) || configTarget.totalQty;
  const priority = document.getElementById('cfg-priority').value;
  const site = document.getElementById('cfg-site').value;
  const colType = configTarget.colType;
  
  // Validate site for PO/TO
  if (colType !== 'job' && !site) {
    showToast('缺少 Site', 'PO 和 TO 必须选择目标 Site');
    return;
  }
  
  const prefix = colType === 'job' ? 'JOB' : (colType === 'po' ? 'PO' : 'TO');
  const newId = prefix + '-NEW-' + Math.floor(Math.random() * 900 + 100);
  
  const typeDescMap = { job: '生产任务', po: '采购任务', to: '调拨任务' };
  
  execItems[colType].push({
    id: newId,
    desc: typeDescMap[colType] + ' ' + configTarget.demands[0].split(':')[0],
    qty,
    priority,
    status: '草稿',
    expanded: false,
    demands: configTarget.demands.map(d => d.split(':')[0]),
    site: colType === 'job' ? null : site,
  });
  
  // Remove from top pool / groups
  configTarget.demands.forEach(key => {
    if (!key.includes(':')) return;
    const [did, line] = key.split(':');
    const dIdx = topDemands.findIndex(x => x.id === did);
    if (dIdx > -1) {
      const d = topDemands[dIdx];
      d.lines = d.lines.filter(l => l.line != line);
      if (d.lines.length === 0) topDemands.splice(dIdx, 1);
    }
  });
  
  // Remove used group
  if (configTarget.demands.length > 1) {
    demandGroups = demandGroups.filter(g => {
      return !(g.demands.length === configTarget.demands.length && g.demands.every(d => configTarget.demands.includes(d)));
    });
  }
  
  showToast('已创建', `${newId} → ${colType.toUpperCase()}列 · ${qty}件`);
  closeConfigDialog();
  render();
}

// ==================== TOAST ====================
function showToast(title, body) {
  const toast = document.getElementById('toast');
  toast.innerHTML = `<div style="font-weight:700;margin-bottom:3px;">${title}</div><div style="color:var(--text-2);">${body}</div>`;
  toast.classList.add('open');
  setTimeout(() => toast.classList.remove('open'), 3000);
}

// ==================== INIT ====================
function render() {
  renderPool();
  renderColumns();
}

render();
</script>
</body>
</html>
